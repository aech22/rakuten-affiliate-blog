name: Generate Articles & Deploy

on:
  schedule:
    - cron: '0 1 * * *'  # 毎日 JST 10:00（価格・在庫を24時間以内に更新＝楽天規約準拠）
  workflow_dispatch:     # 手動実行も可
    inputs:
      skip_generate:
        description: 'true にすると記事の再生成をスキップし、既存コンテンツのビルド/デプロイのみ行う（テンプレート変更の高速反映用）'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install -r requirements.txt

      # 記事生成（fetch → generate）。ルートから実行（main.py が自分で scripts/ を import パスに追加）
      - name: Fetch & Generate
        if: ${{ github.event.inputs.skip_generate != 'true' }}
        env:
          RAKUTEN_APP_ID:        ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY:    ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID:  ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          ANTHROPIC_API_KEY:     ${{ secrets.ANTHROPIC_API_KEY }}
          # Origin/Referer は機密でないので平文。新APIの必須ヘッダに使う（登録ドメインと一致）
          RAKUTEN_REFERER:       https://aech22.github.io/rakuten-affiliate-blog/
          RAKUTEN_ORIGIN:        https://aech22.github.io
        run: python scripts/main.py

      # 機械的品質ゲート（人手レビューなし）。不合格記事があれば非ゼロ終了でジョブを止め、
      # build / deploy まで到達させない＝低品質記事を公開しない
      - name: Quality gate
        if: ${{ github.event.inputs.skip_generate != 'true' }}
        run: python scripts/quality_check.py content/articles --prune

      # 品質ゲートを通った記事をリポジトリに蓄積（過去記事を残してSEOを育てる）
      - name: Commit generated articles
        if: ${{ github.event.inputs.skip_generate != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/articles
          if git diff --staged --quiet; then
            echo "新規記事なし（コミットなし）"
          else
            git commit -m "chore: 記事自動生成 $(date +%F)"
            git push
          fi

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '20'

      - name: Build Astro site
        run: |
          npm ci
          npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

      # 投稿キット（テキスト＋2:3ピン画像）を生成して Google Drive に保存。
      # Drive のOAuth情報(secrets)が未設定なら丸ごとスキップ＝オプトイン。設定時のみ依存を入れる。
      - name: Social kit → Google Drive (optional)
        continue-on-error: true
        env:
          GDRIVE_CLIENT_ID:     ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: |
          if [ -z "$GDRIVE_REFRESH_TOKEN" ]; then
            echo "Google Drive 未設定のためスキップ"; exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
          pip install --quiet Pillow google-auth google-auth-oauthlib google-api-python-client
          python scripts/gen_social_kit.py social/social_kit.csv
          python scripts/gen_pins.py social/pins
          python scripts/gdrive_upload.py

      # 新規記事を X に自動投稿（X APIキー secrets が未設定ならスクリプト側でスキップ）。
      # サイト公開後に実行し、投稿記録(scripts/posted_x.json)をコミットして再投稿を防ぐ。
      - name: Post new articles to X (optional)
        continue-on-error: true
        env:
          X_API_KEY:       ${{ secrets.X_API_KEY }}
          X_API_SECRET:    ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:  ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: |
          python scripts/post_to_x.py
          git add scripts/posted_x.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: X投稿記録を更新"
            git push
          fi
